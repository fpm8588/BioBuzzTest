<text x="60.0" y="810.0" font-size="11">Squares = 18 x 18 in robot. White = start (back edge on wall, 2 in beside the zone). Tinted = park (5 in off the wall, 6 in into the zone).</text>
<text x="60.0" y="827.0" font-size="11">Green circle = flower tower, dashed green square = flower keep-out (28 x 28). Red dashed = HIVE keep-out. Both routes are about 22 in long.</text>
<text x="60.0" y="844.0" font-size="11" fill="#a02020">Flower and HIVE positions are read off a drawing (+/- 10 in) and the zones are assumed from tile names. Measure on the real field.</text>
<text x="265.0" y="615.0" fill="#1d6b10" font-size="11">20 in to flower 1</text><text x="610.0" y="320.0" fill="#1f5fa8" font-weight="bold">blue zone F2</text>
